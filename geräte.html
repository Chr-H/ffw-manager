<h1>🔧 Geräteverwaltung</h1>

<p>Verwaltung aller Geräte der Feuerwehr.</p>

<section class="card">

    <h2>➕ Gerät anlegen / bearbeiten</h2>

    <div class="formular-grid">

        <div class="formular-gruppe">
            <label for="inventar">Inventarnummer</label>
            <input type="text" id="inventar">
        </div>

        <div class="formular-gruppe">
            <label for="bezeichnung">Bezeichnung</label>
            <input type="text" id="bezeichnung">
        </div>

        <div class="formular-gruppe">
            <label for="kategorie">Kategorie</label>
            <select id="kategorie"></select>
        </div>

        <div class="formular-gruppe">
            <label for="hersteller">Hersteller</label>
            <input type="text" id="hersteller">
        </div>

        <div class="formular-gruppe">
            <label for="standort">Standort</label>
            <input type="text" id="standort">
        </div>

        <div class="formular-gruppe">
            <label for="status">Status</label>
            <select id="status">

                <option>Einsatzbereit</option>
                <option>Wartung</option>
                <option>Defekt</option>

            </select>
        </div>

    </div>

    <br>

    <button onclick="neuesGeraet()">
        ➕ Gerät speichern
    </button>

</section>

<br>

<div class="geraete-layout">

    <!-- Linke Seite -->
    <aside class="geraete-sidebar">

        <h2>📋 Geräte</h2>

        <div class="geraete-toolbar">

            <input
                id="sucheGeraet"
                type="text"
                placeholder="🔍 Gerät suchen..."
                onkeyup="filterGeraete()">

            <select
                id="filterKategorie"
                onchange="filterGeraete()">
                <option value="">Alle Kategorien</option>
            </select>

            <select
                id="filterStatus"
                onchange="filterGeraete()">
                <option value="">Alle Status</option>
                <option>Einsatzbereit</option>
                <option>Wartung</option>
                <option>Defekt</option>
            </select>

        </div>

        <table class="geraete-tabelle">

            <thead>

                <tr>

                    <th>Inventar</th>
                    <th>Gerät</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody id="geraeteListe">

            </tbody>

        </table>

    </aside>

    <!-- Rechte Seite -->
    <section class="geraete-detail">

        <h2>📁 Geräteakte</h2>

        <div id="geraeteDetailsInhalt" class="detail-leer">

            👈<br><br>

            Bitte links ein Gerät auswählen.

        </div>

    </section>

</div>
